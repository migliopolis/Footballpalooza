name: Refresh league data

on:
  schedule:
    - cron: '0 6 * * 2'    # Tuesdays 06:00 UTC = Monday 10 PM PST (11 PM during daylight time), after Monday night games
    - cron: '30 17 * * *'  # daily 17:30 UTC = 9:30 AM PST (10:30 AM during daylight time), after MFL's 9 AM waivers
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch from MFL
        env:
          MFL_APIKEY: ${{ secrets.MFL_APIKEY }}
        run: python scripts/refresh_mfl.py
      - name: Fetch from ESPN (teams, logos, rosters and photos, injuries, news)
        continue-on-error: true
        run: python scripts/refresh_espn.py
      - name: Fetch the projected NFL draft order (Tankathon)
        continue-on-error: true
        run: python scripts/refresh_tankathon.py
      - name: Refresh NFL mock drafts (NFL Mock Draft Database), rookie NFL picks, salaries and landing teams
        continue-on-error: true
        run: python scripts/refresh_mocks.py
      - name: Link MFL players to ESPN (photos, display names, spelling report)
        continue-on-error: true
        run: python scripts/link_players.py
      - name: Fetch from FantasyPros (dynasty, rest-of-season and rookie rankings)
        env:
          FANTASYPROS_APIKEY: ${{ secrets.FANTASYPROS_APIKEY }}
        continue-on-error: true
        run: python scripts/refresh_fantasypros.py
      - name: Compute standings, playoff picture and draft order
        run: python scripts/league_now.py
      - name: Check the computation
        run: python tests/test_league_now.py && python tests/test_eliminations.py
      - name: Rebuild Reference history with this season's games
        run: python scripts/build_reference.py
      - name: Build the Awards page (All-FBP teams, season awards)
        continue-on-error: true
        run: python scripts/awards.py
      - name: Build the Payroll page (player earnings)
        continue-on-error: true
        run: python scripts/payroll.py
      - name: Player records (Reference > Players)
        continue-on-error: true
        run: python scripts/player_records.py
      - name: Rosters (League Now > Rosters)
        continue-on-error: true
        run: python scripts/rosters.py
      - name: Role archetypes from ESPN game logs (Rosters)
        continue-on-error: true
        run: python scripts/roles.py
      - name: FBP Power Score (League Now > Power Rankings)
        continue-on-error: true
        run: python scripts/power.py
      - name: Stats (League Now > Stats)
        continue-on-error: true
        run: python scripts/stats.py
      - name: Analytics (League Now > Analytics)
        continue-on-error: true
        run: python scripts/analytics.py
      - name: Trading Floor (Beta > Trading Floor)
        continue-on-error: true
        run: python scripts/trading_floor.py
      - name: Player Value and Trade Value (Trading Floor > Value Chart, Rosters > Value)
        continue-on-error: true
        run: python scripts/trade_values.py
      - name: Player journeys (Player Page, Reference > Players, Trading Floor)
        continue-on-error: true
        run: python scripts/journeys.py
      - name: Trade trees (Trading Floor > History, How it played out)
        continue-on-error: true
        run: python scripts/trade_trees.py
      - name: Build this week's matchups (League Now > Matchups)
        continue-on-error: true
        run: python scripts/matchups.py
      - name: Build the press box columns
        continue-on-error: true
        run: pip install markdown && python scripts/build_columns.py
      - name: Build the share-link preview pages
        continue-on-error: true
        run: python scripts/share_pages.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data rookie-pricer share
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "League data refresh"
            git push
          fi
